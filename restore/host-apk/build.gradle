// 单模块 Gradle 工程：直接构建还原出的 host APK
//
// 布局（本目录即模块根）：
//   src/main/AndroidManifest.xml
//   src/main/java/{com/Riruriru/Sx, irene/window/algui}
//   src/main/res/
//   src/main/assets/       ← 三个载荷（64 / libArkRe.so / libCherryTale.so）
//
// 构建：gradle assembleDebug

plugins {
    id 'com.android.application' version '8.2.0'
}

android {
    namespace 'com.Riruriru.Sx'
    compileSdk 35

    defaultConfig {
        applicationId "com.Riruriru.Sx"
        minSdk 23
        targetSdk 27
        versionCode 1
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding = 'UTF-8'
    }

    // 载荷不能被压缩（注入器要直接读）
    androidResources {
        noCompress 'so', 'dex'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    // 还原的源码里有些 lint 警告，不阻塞构建
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/**']
        }
    }
}

// 让 javac 用英文 + 完整错误输出（默认中文且只打 100 条，看不清原因）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000', '-Xdiags:verbose']
    // -J 参数必须走 forkOptions，不能塞 compilerArgs
    options.fork = true
    options.forkOptions.jvmArgs += [
        '-Duser.language=en',
        '-Duser.country=US',
        '-Dfile.encoding=UTF-8',
    ]
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
